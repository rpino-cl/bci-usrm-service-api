# =============================================================================
# Spring Boot 2.7.18 / Java 8
# =============================================================================
spring.application.name=user-registration-api
server.port=8080

# --- Respuesta JSON
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
spring.jackson.default-property-inclusion=non_null

# -----------------------------------------------------------------------------
# H2 
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola H2: http://localhost:8080/h2-console ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# JPA / Hibernate
# -----------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

#
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# -----------------------------------------------------------------------------
# Correo: formato tipo aaaaaaa@dominio.cl
custom.security.email-regex=^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,6}$
# Clave: minimo 1 letra y 1 digito, 6 a 20 caracteres (acepta el "hunter2").
custom.security.password-regex=^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z0-9!@#$%^&*()_+.\\-]{6,20}$
custom.security.password-message=La clave no cumple el formato requerido

# -----------------------------------------------------------------------------
# JWT
# -----------------------------------------------------------------------------
custom.jwt.secret=U2VybWFsdWNCQ0lVc2VyUmVnaXN0cmF0aW9uQXBpSnd0U2VjcmV0S2V5MjAyNg==
custom.jwt.expiration-ms=86400000
custom.jwt.issuer=new-create-api
